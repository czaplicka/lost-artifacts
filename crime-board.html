<section class="crime-board-app is-sidebar-collapsed" aria-label="Crime board workspace">
  <button
    id="crime-board-sidebar-tab"
    class="crime-board-sidebar-tab"
    type="button"
    aria-controls="crime-board-sidebar"
    aria-expanded="false"
    title="Open crime board sidebar"
  >
    Board
  </button>

  <aside
    id="crime-board-sidebar"
    class="crime-board-sidebar is-collapsed"
    aria-label="Crime board controls"
  >
    <div class="crime-board-sidebar__header">
      <div>
        <p class="crime-board-sidebar__eyebrow">Investigation</p>
        <h2 class="crime-board-sidebar__title">Crime Board</h2>
      </div>

      <button
        id="crime-board-sidebar-toggle"
        class="crime-board-btn crime-board-btn--ghost"
        type="button"
        aria-controls="crime-board-sidebar"
        aria-expanded="false"
      >
        Show
      </button>
    </div>

    <div class="crime-board-sidebar__section">
      <h3 class="crime-board-sidebar__section-title">Create item</h3>
      <div class="crime-board-toolbar">
        <button id="add-photo-btn" class="crime-board-btn" type="button">Add photo</button>
        <button id="add-note-btn" class="crime-board-btn" type="button">Add note</button>
        <button id="add-evidence-btn" class="crime-board-btn" type="button">Add evidence</button>
      </div>
    </div>

    <div class="crime-board-sidebar__section">
      <h3 class="crime-board-sidebar__section-title">Selected item</h3>

      <div id="crime-board-empty-state" class="crime-board-empty-state">
        Select a player-created note, photo, or evidence card to edit it here.
      </div>

      <form id="crime-board-form" class="crime-board-form" autocomplete="off">
        <div id="crime-board-fields" class="crime-board-fields">
          <label class="crime-board-field">
            <span>Type</span>
            <select name="type">
              <option value="note">Note</option>
              <option value="photo">Photo</option>
              <option value="evidence">Evidence</option>
            </select>
          </label>

          <label class="crime-board-field">
            <span>Label</span>
            <input name="label" type="text" maxlength="80" />
          </label>

          <label class="crime-board-field">
            <span>Color</span>
            <select name="color">
              <option value="yellow">Yellow</option>
              <option value="blue">Blue</option>
              <option value="pink">Pink</option>
            </select>
          </label>

          <label class="crime-board-field crime-board-field--inline">
            <input name="pinned" type="checkbox" />
            <span>Pinned</span>
          </label>

          <div id="crime-board-type-fields" class="crime-board-dynamic-fields"></div>
        </div>

        <div class="crime-board-form__actions">
          <button id="crime-board-apply-btn" class="crime-board-btn" type="button">Apply</button>
          <button id="crime-board-delete-btn" class="crime-board-btn crime-board-btn--danger" type="button">Delete</button>
        </div>
      </form>
    </div>

    <div class="crime-board-sidebar__section">
      <h3 class="crime-board-sidebar__section-title">Connections</h3>
      <p id="crime-board-links-empty" class="crime-board-links-empty">
        No visible connections yet.
      </p>
      <ul id="crime-board-links-list" class="crime-board-links-list"></ul>
    </div>

    <div class="crime-board-sidebar__section">
      <h3 class="crime-board-sidebar__section-title">Board JSON</h3>
      <div class="crime-board-json-actions">
        <button id="board-save-btn" class="crime-board-btn crime-board-btn--ghost" type="button">Export</button>
        <button id="board-load-btn" class="crime-board-btn crime-board-btn--ghost" type="button">Import</button>
      </div>
      <textarea
        id="board-json-output"
        class="crime-board-json-output"
        spellcheck="false"
        aria-label="Crime board JSON data"
      ></textarea>
    </div>
  </aside>

  <div class="crime-board-shell">
    <div
      id="crime-board"
      class="crime-board"
      role="region"
      aria-label="Investigation board"
    >
      <svg
        class="crime-board__strings"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      ></svg>

      <div class="crime-board__items"></div>
    </div>
  </div>
</section>
