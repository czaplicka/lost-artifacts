<style>
    /* Ramka zajmuje wyłącznie pole zdjęcia na teczce. */
    #agent-modal .dossier-card > .agent-portrait-frame {
        position: absolute;
        top: 24.1%;
        left: 34.7%;

        display: block;
        width: 10.6%;
        height: 24.1%;

        min-width: 0;
        min-height: 0;
        max-width: none;
        max-height: none;

        margin: 0;
        padding: 0;
        overflow: hidden;

        background: #202020;
        border: 0;
        border-radius: 0;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.45);

        pointer-events: none;
    }

    /*
     * Portret zachowuje swój układ 280 × 310.
     * Skalowaniem zajmuje się SVG, nie transform z agent.css.
     */
    #agent-modal
    .agent-portrait-frame
    #pub-avatar.agent-avatar.agency-id-avatar {
        position: relative !important;
        inset: auto !important;
        top: 0 !important;
        left: 0 !important;

        display: block !important;
        box-sizing: border-box !important;

        width: 280px !important;
        height: 310px !important;

        min-width: 0 !important;
        min-height: 0 !important;
        max-width: none !important;
        max-height: none !important;

        margin: 0 !important;
        padding: 0 !important;

        overflow: hidden !important;

        transform: none !important;
        translate: none !important;
        rotate: none !important;
        scale: none !important;

        background: #202020;
        border: 0 !important;
        border-radius: 0 !important;
        box-shadow: none !important;

        isolation: isolate;
        transition: none !important;
    }
</style>

<div id="agent-modal" style="display: none;">
    <div
        class="dossier-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="agent-dossier-title"
    >
        <button
            id="btn-close-agent"
            class="btn-close"
            type="button"
            aria-label="Close agent dossier"
        >
            X
        </button>

        <svg
            class="agent-portrait-frame"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 280 310"
            preserveAspectRatio="xMidYMin meet"
            aria-hidden="true"
            focusable="false"
        >
            <foreignObject
                x="0"
                y="0"
                width="280"
                height="310"
            >
                <div
                    xmlns="http://www.w3.org/1999/xhtml"
                    id="pub-avatar"
                    class="agent-avatar agency-id-avatar"
                    data-skin-tone="light"
                    data-hair-style="neat"
                    data-hair-color="brown"
                    data-coat="trench"
                    data-facial-hair="none"
                    data-makeup="none"
                    data-accessory="none"
                >
                    <div class="avatar-coat"></div>
                    <div class="avatar-neck"></div>
                    <div class="avatar-face"></div>

                    <div class="avatar-ear avatar-ear--left"></div>
                    <div class="avatar-ear avatar-ear--right"></div>

                    <div class="avatar-hair"></div>
                    <div class="avatar-eyes"></div>
                    <div class="avatar-nose"></div>
                    <div class="avatar-mouth"></div>

                    <div class="avatar-facial-hair"></div>
                    <div class="avatar-makeup"></div>
                    <div class="avatar-accessory"></div>
                </div>
            </foreignObject>
        </svg>

        <div class="agent-info">
            <h2 id="agent-dossier-title">
                AGENT: <span id="pub-alias">Detective</span>
            </h2>

            <p>
                RANK: <span id="pub-rank">Junior Agent</span>
            </p>

            <p>
                STATUS: <span class="status-active">ACTIVE</span>
            </p>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <strong>SCORE</strong>
                <span id="pub-points">0</span>
            </div>

            <div class="stat-item">
                <strong>WORLD RANK</strong>
                <span>#<span id="pub-leaderboard">---</span></span>
            </div>

            <div class="stat-item">
                <strong>CASES CLOSED</strong>
                <span id="pub-cases">0</span>
            </div>

            <div class="stat-item">
                <strong>ARRESTS</strong>
                <span id="pub-arrests">0</span>
            </div>
        </div>

        <div
            id="achievement-grid"
            class="achievement-grid"
            aria-label="Agent achievements"
        ></div>

        <div class="actions-footer">
            <button
                id="btn-copy-link"
                class="btn-stamp"
                type="button"
            >
                [ COPY DOSSIER LINK ]
            </button>

            <div
                id="toast"
                class="toast-msg"
                style="display: none;"
            >
                ✓ Link copied!
            </div>

            <p class="join-link">
                <a href="index.html">
                    Want to join? Play Lost Artefacts
                </a>
            </p>
        </div>
    </div>
</div>
