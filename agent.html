<div id="agent-modal" style="display: none;">
    <div
        class="dossier-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="agent-dossier-title"
    >
        <button
            id="btn-close-agent"
            class="btn-close"
            type="button"
            aria-label="Close agent dossier"
        >
            X
        </button>


  <div
    id="pub-avatar"
    class="agent-avatar agency-id-avatar"
    data-skin-tone="light"
    data-hair-style="neat"
    data-hair-color="brown"
    data-coat="trench"
    data-facial-hair="none"
    data-makeup="none"
    data-accessory="none"
    role="img"
    aria-label="Agent portrait"
  >
    <div class="avatar-coat"></div>
    <div class="avatar-neck"></div>
    <div class="avatar-face"></div>

    <div class="avatar-ear avatar-ear--left"></div>
    <div class="avatar-ear avatar-ear--right"></div>

    <div class="avatar-hair"></div>
    <div class="avatar-eyes"></div>
    <div class="avatar-nose"></div>
    <div class="avatar-mouth"></div>

    <div class="avatar-facial-hair"></div>
    <div class="avatar-makeup"></div>
    <div class="avatar-accessory"></div>
  </div>


        <div class="agent-info">
            <h2 id="agent-dossier-title">
                AGENT: <span id="pub-alias">Detective</span>
            </h2>

            <p>RANK: <span id="pub-rank">Junior Agent</span></p>
            <p>STATUS: <span class="status-active">ACTIVE</span></p>
        </div>

        <div class="stats-grid">
            <div class="stat-item">
                <strong>SCORE</strong>
                <span id="pub-points">0</span>
            </div>

            <div class="stat-item">
                <strong>WORLD RANK</strong>
                <span>#<span id="pub-leaderboard">---</span></span>
            </div>

            <div class="stat-item">
                <strong>CASES CLOSED</strong>
                <span id="pub-cases">0</span>
            </div>

            <div class="stat-item">
                <strong>ARRESTS</strong>
                <span id="pub-arrests">0</span>
            </div>
        </div>

        <div
            id="achievement-grid"
            class="achievement-grid"
            aria-label="Agent achievements"
        ></div>

        <div class="actions-footer">
            <button id="btn-copy-link" class="btn-stamp" type="button">
                [ COPY DOSSIER LINK ]
            </button>

            <div id="toast" class="toast-msg" style="display: none;">
                ✓ Link copied!
            </div>

            <p class="join-link">
                <a href="index.html">Want to join? Play Lost Artefacts</a>
            </p>
        </div>
    </div>
</div>
