<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Emergency Reset Procedure — Mark Agency HQ</title>
  <link rel="stylesheet" href="./assets/css/reset.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap"
    rel="stylesheet"
  >
</head>

<body>
  <main class="detective-card">
    <h1>Emergency Procedure</h1>

    <p class="info-text">
      Provide the agent's email address. HQ will send a confidential envelope
      containing the access code reset procedure.
    </p>

    <form id="reset-form" class="reset-form" novalidate>
      <div class="form-group">
        <label for="reset-email">Agent email</label>

        <input
          id="reset-email"
          name="email"
          type="email"
          placeholder="agent@interpol.com"
          autocomplete="email"
          required
        >
      </div>

      <button class="btn-stamp" id="resetbtn" type="submit">
        Send code
      </button>

      <!-- Status notification area for screen readers -->
      <div id="reset-message" class="status-msg" aria-live="polite" hidden></div>

      <div class="form-actions">
        <a href="login.html" class="btn-secondary" id="loginbtn">
          Cancel / back to log in
        </a>
      </div>
    </form>
  </main>

  <script type="module">
    import { supabase } from './supabase-client.js';

    const form = document.querySelector('#reset-form');
    const emailInput = document.querySelector('#reset-email');
    const resetButton = document.querySelector('#resetbtn');
    const messageElement = document.querySelector('#reset-message');

    function showMessage(message, type) {
      messageElement.textContent = message;
      messageElement.className = `status-msg ${type}`;
      messageElement.hidden = false;
    }

    function hideMessage() {
      messageElement.textContent = '';
      messageElement.className = 'status-msg';
      messageElement.hidden = true;
    }

    function setBusy(isBusy) {
      resetButton.disabled = isBusy;
      resetButton.textContent = isBusy
        ? 'Dispatching envelope...'
        : 'Send code';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      hideMessage();

      const email = emailInput.value.trim();

      if (!email) {
        showMessage("Please enter the agent's email address.", 'error');
        return;
      }

      setBusy(true);

      try {
        const redirectTo = new URL(
          'update-password.html',
          window.location.href
        ).toString();

        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo,
        });

        if (error) {
          console.error('Supabase resetPasswordForEmail error:', error.message);
          showMessage(
            'HQ could not dispatch the envelope. Please try again in a moment.',
            'error'
          );
          return;
        }

        showMessage(
          'If the account exists, the reset instructions have been dispatched to the provided address.',
          'success'
        );

        form.reset();
      } catch (err) {
        console.error('Unexpected connection error:', err);
        showMessage(
          'Connection lost. Please check your network and try again.',
          'error'
        );
      } finally {
        setBusy(false);
      }
    });
  </script>
</body>
</html>
