<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>New Authorization Code — Mark Agency HQ</title>
  <link rel="stylesheet" href="./assets/css/update-password.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap"
    rel="stylesheet"
  >
</head>

<body>
  <main class="detective-card">
    <h1>New Authorization Code</h1>

    <p class="info-text">
      Set a new access code for agency files.
    </p>

    <form id="update-password-form" class="update-form" novalidate>
      <div class="form-group">
        <label for="new-password">New secret code</label>

        <input
          id="new-password"
          name="newPassword"
          type="password"
          minlength="6"
          autocomplete="new-password"
          placeholder="Minimum 6 characters"
          disabled
          required
        >
      </div>

      <div class="form-group">
        <label for="confirm-password">Repeat secret code</label>

        <input
          id="confirm-password"
          name="confirmPassword"
          type="password"
          minlength="6"
          autocomplete="new-password"
          placeholder="Enter code again"
          disabled
          required
        >
      </div>

      <button id="update-password-button" class="btn-stamp" type="submit" disabled>
        Set new code
      </button>

      <!-- Area for accessibility status messages -->
      <div id="update-message" class="status-msg" aria-live="polite" hidden></div>

      <div class="form-actions">
        <a href="login.html" class="btn-secondary">
          Back to log in
        </a>
      </div>
    </form>
  </main>

  <script type="module">
    import { supabase } from './supabase-client.js';

    const form = document.querySelector('#update-password-form');
    const newPasswordInput = document.querySelector('#new-password');
    const confirmPasswordInput = document.querySelector('#confirm-password');
    const updateButton = document.querySelector('#update-password-button');
    const messageElement = document.querySelector('#update-message');

    let recoverySessionReady = false;
    let authSubscription = null;

    function showMessage(message, type) {
      messageElement.textContent = message;
      messageElement.className = `status-msg ${type}`;
      messageElement.hidden = false;
    }

    function hideMessage() {
      messageElement.textContent = '';
      messageElement.className = 'status-msg';
      messageElement.hidden = true;
    }

    function setFormEnabled(isEnabled) {
      newPasswordInput.disabled = !isEnabled;
      confirmPasswordInput.disabled = !isEnabled;
      updateButton.disabled = !isEnabled;
    }

    function setBusy(isBusy) {
      updateButton.disabled = isBusy;
      updateButton.textContent = isBusy
        ? 'Updating dossier...'
        : 'Set new code';
    }

    function unlockRecoveryForm() {
      recoverySessionReady = true;
      setFormEnabled(true);

      showMessage(
        'Identity confirmed. Please set your new access code.',
        'info',
      );

      newPasswordInput.focus();
    }

    // Subscribe to auth state changes for PASSWORD_RECOVERY event
    const { data: { subscription } } = supabase.auth.onAuthStateChange((event, session) => {
      if (event === 'PASSWORD_RECOVERY' && session) {
        unlockRecoveryForm();
      }
    });
    authSubscription = subscription;

    window.addEventListener('pagehide', () => {
      authSubscription?.unsubscribe();
    });

    window.addEventListener('load', async () => {
      try {
        const { data: { session }, error } = await supabase.auth.getSession();

        if (error) {
          console.error('Failed to read recovery session:', error.message);
          showMessage(
            'Failed to verify reset instructions. Please request a new link.',
            'error',
          );
          return;
        }

        /*
         * In a typical Supabase flow, the PASSWORD_RECOVERY event unlocks the form.
         * This fallback handles cases where the client already saved the session 
         * before registering the event listener.
         */
        if (session && !recoverySessionReady) {
          unlockRecoveryForm();
        } else if (!session && !recoverySessionReady) {
          showMessage(
            'This link is invalid, expired, or has already been used. Please request a new password reset.',
            'error',
          );
        }
      } catch (err) {
        console.error('Session retrieval network error:', err);
        showMessage(
          'Connection lost while verifying session. Please refresh or try again.',
          'error',
        );
      }
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      hideMessage();

      if (!recoverySessionReady) {
        showMessage(
          'Missing valid reset authorization. Please request a new link.',
          'error',
        );
        return;
      }

      const newPassword = newPasswordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (newPassword.length < 6) {
        showMessage(
          'The new access code must be at least 6 characters long.',
          'error',
        );
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage(
          'Entered access codes do not match.',
          'error',
        );
        return;
      }

      setBusy(true);

      try {
        const { error } = await supabase.auth.updateUser({
          password: newPassword,
        });

        if (error) {
          console.error('Supabase updateUser error:', error.message);
          showMessage(
            'Failed to update access code. Please request a new reset link.',
            'error',
          );
          return;
        }

        form.reset();
        setFormEnabled(false);

        showMessage(
          'Access code updated successfully. Returning to login shortly.',
          'success',
        );

        await supabase.auth.signOut();

        window.setTimeout(() => {
          window.location.href = 'login.html';
        }, 2200);
      } catch (err) {
        console.error('Unexpected update error:', err);
        showMessage(
          'Connection lost. Please check your network connection and try again.',
          'error',
        );
      } finally {
        setBusy(false);
      }
    });
  </script>
</body>
</html>
