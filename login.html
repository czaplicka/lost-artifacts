<div class="detective-form" id="login-form">
    <h2>Dostęp do akt</h2>
    <label>ID Agenta (Email):</label>
    <input type="email" id="login-email" placeholder="agent@interpol.com" required>
    
    <label>Kod autoryzacyjny (Hasło):</label>
    <input type="password" id="login-password" placeholder="********" required>
    
    <button class="btn-stamp" id="btn-login">ZALOGUJ</button>
    <p class="error-msg" id="login-error" style="color:red; display:none;"></p>
    
    <div style="margin-top: 20px;">
        <span class="form-link" id="link-register">Złóż podanie (Rejestracja)</span><br>
        <span class="form-link" id="link-reset">Zgubiłem kod (Reset hasła)</span>
    </div>
</div>
