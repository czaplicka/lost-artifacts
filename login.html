<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Enter Mark Agency HQ — Log in</title>
<link rel="stylesheet" href="./assets/css/login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap"
    rel="stylesheet"
  >
</head>

<body>
  <main class="detective-card">
    <h1>Enter Mark Agency HQ</h1>

    <p class="intro">
      Confirm your identity, agent. HQ awaits your raport.
    </p>

    <form id="login-form" class="login-form">
      <div class="form-group">
        <label for="login-email">Agent ID (e-mail)</label>

        <input
          id="login-email"
          type="email"
          placeholder="agent@interpol.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="login-password">Authorization Code (password)</label>

        <input
          id="login-password"
          type="password"
          placeholder="********"
          autocomplete="current-password"
          required
        >
      </div>

      <button id="loginbtn" class="btn-stamp" type="submit">
        Log in
      </button>

      <p id="login-error" class="status-msg error" role="alert"></p>

      <div class="form-actions">
        <a href="register.html" class="btn-secondary" id="registerbtn">
          Register
        </a>

        <a href="reset.html" class="btn-secondary" id="resetbtn">
          Reset password
        </a>
      </div>
    </form>
  </main>

  <script type="module">
    import { supabase } from './supabase-client.js';

    const form = document.querySelector('#login-form');
    const emailInput = document.querySelector('#login-email');
    const passwordInput = document.querySelector('#login-password');
    const loginButton = document.querySelector('#loginbtn');
    const errorElement = document.querySelector('#login-error');

    function showError(message) {
      errorElement.textContent = message;
      errorElement.className = 'status-msg error';
      errorElement.style.display = 'block';
    }

    function hideError() {
      errorElement.textContent = '';
      errorElement.style.display = 'none';
    }

    function setBusy(isBusy) {
      loginButton.disabled = isBusy;
      loginButton.textContent = isBusy
        ? 'Connecting to HQ...'
        : 'Log in';
    }

    function translateAuthError(message) {
      const normalizedMessage = message.toLowerCase();

      if (normalizedMessage.includes('invalid login credentials')) {
        return 'Nieprawidłowy Agent ID lub kod autoryzacyjny.';
      }

      if (normalizedMessage.includes('email not confirmed')) {
        return 'Potwierdź adres e-mail przed pierwszym logowaniem.';
      }

      if (normalizedMessage.includes('too many requests')) {
        return 'Za dużo prób logowania. Spróbuj ponownie za chwilę.';
      }

      return 'Nie udało się połączyć z centralą. Spróbuj ponownie.';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      hideError();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showError('Podaj Agent ID oraz kod autoryzacyjny.');
        return;
      }

      setBusy(true);

      const { data, error } = await supabase.auth.signInWithPassword({
        email,
        password,
      });

      setBusy(false);

      if (error) {
        console.error('Supabase signInWithPassword:', error.message);
        showError(translateAuthError(error.message));
        return;
      }

      if (!data.session || !data.user) {
        showError('Centrala nie zwróciła aktywnej sesji. Spróbuj ponownie.');
        return;
      }

      window.parent.postMessage(
        {
          type: 'lost-artefacts:auth-signed-in',
        },
        window.location.origin,
      );
    });
  </script>
</body>
</html>
