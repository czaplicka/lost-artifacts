<div class="detective-form" id="register-form">
    <h2>Formularz Rekruta</h2>
    <label>Pseudonim (wyświetlany w rankingu):</label>
    <input type="text" id="reg-alias" placeholder="np. Kruk" required>

    <label>Adres kontaktowy (Email):</label>
    <input type="email" id="reg-email" placeholder="agent@interpol.com" required>
    
    <label>Tajne hasło (min. 6 znaków):</label>
    <input type="password" id="reg-password" placeholder="********" required>
    
    <button class="btn-stamp" id="btn-register">ZAREJESTRUJ</button>
    
    <div style="margin-top: 20px;">
        <span class="form-link" id="link-back-login">Wróć do logowania</span>
    </div>
</div>
