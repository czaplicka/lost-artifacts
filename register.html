<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Recruitment Form — Mark Agency HQ</title>
  <link rel="stylesheet" href="./assets/css/register.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap"
    rel="stylesheet"
  >
</head>

<body>
  <main class="detective-card">
    <h1>Recruitment Form</h1>

    <p class="intro">
      Open an agent dossier to log investigations at HQ.
    </p>

    <form id="register-form" class="register-form" novalidate>
      <div class="form-group">
        <label for="reg-alias">Agent Alias</label>

        <input
          id="reg-alias"
          name="alias"
          type="text"
          placeholder="e.g., Raven"
          minlength="2"
          maxlength="40"
          autocomplete="nickname"
          required
        >
      </div>

      <div class="form-group">
        <label for="reg-email">Contact Address (email)</label>

        <input
          id="reg-email"
          name="email"
          type="email"
          placeholder="agent@interpol.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="reg-password">Secret Code (minimum 6 characters)</label>

        <input
          id="reg-password"
          name="password"
          type="password"
          placeholder="********"
          minlength="6"
          autocomplete="new-password"
          required
        >
      </div>

      <div class="form-group">
        <label for="reg-referral">Recruitment Code (optional)</label>

        <input
          id="reg-referral"
          name="referral"
          type="text"
          placeholder="MA-XXXXXX"
          maxlength="20"
          autocomplete="off"
          autocapitalize="characters"
          spellcheck="false"
        >
      </div>

      <button class="btn-stamp" id="registerbtn" type="submit">
        Register
      </button>

      <div id="register-message" class="status-msg" aria-live="polite" hidden></div>

      <div class="form-actions">
        <a href="login.html" class="btn-secondary" id="loginbtn">
          Back to log in
        </a>
      </div>
    </form>
  </main>

  <script type="module">
    import { supabase } from './supabase-client.js';

    const REFERRAL_STORAGE_KEY = 'lost-artefacts:referral-code';
    const REFERRAL_PATTERN = /^[A-Z0-9-]{4,20}$/;

    const form = document.querySelector('#register-form');
    const aliasInput = document.querySelector('#reg-alias');
    const emailInput = document.querySelector('#reg-email');
    const passwordInput = document.querySelector('#reg-password');
    const referralInput = document.querySelector('#reg-referral');
    const registerButton = document.querySelector('#registerbtn');
    const messageElement = document.querySelector('#register-message');

    function normalizeReferral(value) {
      return String(value || '').trim().toUpperCase();
    }

    function readReferralFromUrl() {
      const sources = [window.location.search];

      try {
        if (window.parent && window.parent !== window) {
          sources.push(window.parent.location.search);
        }
      } catch (error) {
        // Parent is not readable; the local URL and storage are enough.
      }

      for (const search of sources) {
        const value = normalizeReferral(new URLSearchParams(search).get('ref'));
        if (REFERRAL_PATTERN.test(value)) return value;
      }

      return '';
    }

    function initReferralField() {
      const fromUrl = readReferralFromUrl();

      if (fromUrl) {
        try {
          localStorage.setItem(REFERRAL_STORAGE_KEY, fromUrl);
        } catch (error) {
          console.warn('Referral code could not be stored:', error);
        }
        referralInput.value = fromUrl;
        return;
      }

      try {
        const stored = normalizeReferral(localStorage.getItem(REFERRAL_STORAGE_KEY));
        if (REFERRAL_PATTERN.test(stored)) referralInput.value = stored;
      } catch (error) {
        console.warn('Referral code could not be read:', error);
      }
    }

    function showMessage(message, type) {
      messageElement.textContent = message;
      messageElement.className = `status-msg ${type}`;
      messageElement.hidden = false;
    }

    function hideMessage() {
      messageElement.textContent = '';
      messageElement.className = 'status-msg';
      messageElement.hidden = true;
    }

    function setBusy(isBusy) {
      registerButton.disabled = isBusy;
      registerButton.textContent = isBusy
        ? 'Opening dossier...'
        : 'Register';
    }

    function translateAuthError(message) {
      const normalizedMessage = message.toLowerCase();

      if (normalizedMessage.includes('password')) {
        return 'Authorization code does not meet HQ requirements.';
      }

      if (normalizedMessage.includes('email')) {
        return 'Please enter a valid email address.';
      }

      if (normalizedMessage.includes('too many requests')) {
        return 'Too many attempts. HQ is temporarily blocking recruitment.';
      }

      return 'Failed to create agent dossier. Please try again.';
    }

    referralInput.addEventListener('input', () => {
      referralInput.value = normalizeReferral(referralInput.value);
    });

    initReferralField();

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      hideMessage();

      const alias = aliasInput.value.trim();
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const referralCode = normalizeReferral(referralInput.value);

      if (alias.length < 2) {
        showMessage('Agent alias must be at least 2 characters long.', 'error');
        return;
      }

      if (password.length < 6) {
        showMessage('Authorization code must be at least 6 characters long.', 'error');
        return;
      }

      if (referralCode && !REFERRAL_PATTERN.test(referralCode)) {
        showMessage('Recruitment code looks invalid. Check it or leave it empty.', 'error');
        return;
      }

      setBusy(true);

      try {
        const emailRedirectTo = new URL(
          'login.html',
          window.location.href,
        ).toString();

        const metadata = {
          display_name: alias,
          agent_alias: alias,
        };

        if (referralCode) metadata.referral_code = referralCode;

        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo,
            data: metadata,
          },
        });

        if (error) {
          console.error('Supabase signUp error:', error.message);
          showMessage(translateAuthError(error.message), 'error');
          return;
        }

        try {
          localStorage.removeItem(REFERRAL_STORAGE_KEY);
        } catch (storageError) {
          console.warn('Referral code could not be cleared:', storageError);
        }

        if (data.session && data.user) {
          window.parent.postMessage(
            {
              type: 'lost-artefacts:auth-signed-in',
            },
            window.location.origin,
          );
          return;
        }

        showMessage(
          'Dossier created. Please check your inbox and confirm your address before logging in.',
          'success',
        );

        window.parent.postMessage(
          {
            type: 'lost-artefacts:auth-registered',
          },
          window.location.origin,
        );
      } catch (err) {
        console.error('Unexpected connection error:', err);
        showMessage(
          'Connection lost. Please check your network connection and try again.',
          'error',
        );
      } finally {
        setBusy(false);
      }
    });
  </script>
</body>
</html>
